services:
  cellarium:
    build: .
    image: cellarium:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CELLARIUM_DATA_DIR: /data
      CELLARIUM_HOST: 0.0.0.0
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8770:8770"   # publish behind a reverse proxy (see deploy/nginx.conf)
