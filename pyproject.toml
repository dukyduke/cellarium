[project]
name = "cellarium"
version = "0.1.0"
description = "Self-hosted wine cellar manager with racks, drinking schedule and MCP (AI) integration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Guillaume Chevillot" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cellarium = "cellarium.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cellarium*"]

[tool.setuptools.package-data]
cellarium = ["static/**/*", "guides/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
