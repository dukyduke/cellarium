# Example nginx site for Cellarium behind HTTPS (certbot/Let's Encrypt).
# Set CELLARIUM_SECURE_COOKIES=true in .env when served over HTTPS.
server {
    listen 443 ssl http2;
    server_name cave.example.org;

    ssl_certificate     /etc/letsencrypt/live/cave.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cave.example.org/privkey.pem;

    client_max_body_size 12m;   # photo uploads (10 MB max in the app)

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP (Streamable HTTP): no buffering, long reads.
    location /mcp {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name cave.example.org;
    return 301 https://$host$request_uri;
}
